<!-- Credentials mini app layout. Shown inside index.html by main.js.
     If this file is opened directly, send the visitor to the app instead. -->
<script>location.replace("./#credentials");</script>

<header class="subbar">
  <a class="square-btn" href="./" data-back aria-label="Back to the vault"><span data-icon="back"></span></a>
  <h1>Credentials</h1>
  <button class="square-btn" type="button" data-cred-lock aria-label="Lock now" hidden><span data-icon="lock"></span></button>
  <button class="square-btn add-btn-head" type="button" data-cred-add aria-label="Add an account" hidden><span data-icon="plus"></span></button>
</header>

<div class="cred-body" data-body>
  <p class="bills-loading">Loading…</p>
</div>
