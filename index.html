<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PocketVault</title>
  <meta name="description" content="Bills, investments and holidays, kept safe and to hand.">
  <meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="./auth-guard.js"></script>
  <script type="module" src="./home.js"></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="">
        <span class="wordmark">Pocket<span>Vault</span></span>
      </div>
      <div class="account">
        <button id="account-btn" class="icon-btn avatar-btn" type="button" aria-label="Account and sign out" aria-haspopup="true" aria-expanded="false">R</button>
        <div id="account-menu" class="account-menu" hidden>
          <div id="account-email" class="account-email"></div>
          <button id="signout-btn" class="menu-item" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <section class="greeting">
      <h1 id="greeting-text">Hello</h1>
      <p id="today-text"></p>
    </section>

    <section>
      <h2 class="section-label">Your apps</h2>
      <nav class="tiles" aria-label="Apps">
        <a class="tile" href="bills.html" data-tile="bills">
          <div class="tile-chip chip-bills">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 11l2 2 4-4"/></svg>
          </div>
          <div class="tile-body">
            <span class="tile-title">Bills</span>
            <span class="tile-line">Tick off each month</span>
          </div>
        </a>

        <a class="tile" href="investments.html" data-tile="investments">
          <div class="tile-chip chip-invest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          </div>
          <div class="tile-body">
            <span class="tile-title">Investments</span>
            <span class="tile-line">Value and goals</span>
          </div>
        </a>

        <a class="tile" href="holidays.html" data-tile="holidays">
          <div class="tile-chip chip-hols">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M9 11v5M15 11v5"/></svg>
          </div>
          <div class="tile-body">
            <span class="tile-title">Holidays</span>
            <span class="tile-line">Trip budgets</span>
          </div>
        </a>

        <div class="tile tile-more" aria-disabled="true">
          <div class="tile-chip chip-more">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="tile-body">
            <span class="tile-title">More soon</span>
            <span class="tile-line">Income &amp; more</span>
          </div>
        </div>
      </nav>
    </section>

    <footer class="footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span>Signed in securely</span>
    </footer>
  </main>
</body>
</html>
