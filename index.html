<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PocketVault</title>
  <meta name="description" content="Bills, investments and holidays, kept safe and to hand.">
  <meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="./auth-guard.js"></script>
  <script type="module" src="./home.js"></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="">
        <span class="wordmark">Pocket<span>Vault</span></span>
      </div>
      <button id="eye-btn" class="square-btn eye-btn" type="button" aria-label="Hide amounts" aria-pressed="false"></button>
    </header>

    <section class="dateline" aria-label="Today">
      <span class="day" id="day-text"></span>
      <span class="date" id="date-text"></span>
    </section>

    <a class="next-due" id="next-due" href="bills.html" data-go="bills" hidden>
      <div>
        <div class="label">Next due</div>
        <div class="what" id="next-due-what"></div>
      </div>
      <span class="amount amt" id="next-due-amount"></span>
    </a>

    <nav class="boxes" id="boxes" aria-label="Apps">
      <a class="box" href="bills.html" data-go="bills" data-box="bills">
        <span class="box-glyph" data-icon="bills"></span>
        <div class="box-body">
          <span class="box-title">Bills</span>
          <span class="box-line">Tick off each month</span>
        </div>
      </a>

      <a class="box" href="investments.html" data-go="investments" data-box="investments">
        <span class="box-glyph" data-icon="investments"></span>
        <div class="box-body">
          <span class="box-title">Investments</span>
          <span class="box-line">Value and goals</span>
        </div>
      </a>

      <a class="box" href="holidays.html" data-go="holidays" data-box="holidays">
        <span class="box-glyph" data-icon="holidays"></span>
        <div class="box-body">
          <span class="box-title">Holidays</span>
          <span class="box-line">Trip budgets</span>
        </div>
      </a>

      <div class="box vacant" aria-disabled="true">
        <span class="box-glyph" data-icon="vacant"></span>
        <div class="box-body">
          <span class="box-title">Vacant</span>
          <span class="box-line">Reserved for later</span>
        </div>
      </div>
    </nav>
  </main>
</body>
</html>
