<!-- Bills mini app layout. Shown inside index.html by main.js.
     If this file is opened directly, send the visitor to the app instead. -->
<script>location.replace("./#bills");</script>

<header class="subbar">
  <a class="square-btn" href="./" data-back aria-label="Back to the vault"><span data-icon="back"></span></a>
  <h1>Bills</h1>
  <button class="square-btn eye-btn" type="button" data-eye aria-label="Hide amounts" aria-pressed="false"></button>
  <button class="square-btn" type="button" data-bills-settings aria-label="Bill settings"><span data-icon="gear"></span></button>
  <button class="square-btn add-btn-head" type="button" data-add-bill aria-label="Add a bill"><span data-icon="plus"></span></button>
</header>

<div class="period-line">
  <span class="period" data-period></span>
  <span class="paid-count" data-paid-count></span>
</div>

<div class="pots" data-pots></div>

<div class="bill-list" data-list>
  <p class="bills-loading">Loading bills…</p>
</div>

<button class="btn-dashed" type="button" data-new-period>Start new period</button>
